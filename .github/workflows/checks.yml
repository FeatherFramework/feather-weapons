name: Regression checks

on:
  pull_request:
  push:
    branches: [main, 'ci/automated-release-checks']

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: feather-weapons
    steps:
      - uses: actions/checkout@v4
        with:
          path: feather-weapons
      # Pin integration sources so unrelated upstream pushes cannot change a run.
      - uses: actions/checkout@v4
        with:
          # Paired Inventory PR #70: immutable regular-arrow implementation.
          repository: JusCampin/feather-inventory
          ref: ec9c5a9792d4cd52af4267115642dd313362c01e
          path: feather-inventory
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: FeatherFramework/feather-character
          ref: 044a80743f2c870b39f103ef50d519f39804a217
          path: feather-character
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua test runtime
        run: python -m pip install lupa==2.8
      - name: Verify Lua regressions and runtime syntax
        run: python tests/run_lua.py
      - name: Verify JavaScript contracts
        run: node --test tests/*.test.mjs
